function updateWord(){const w=words[targetIndex].word;el('word').replaceChildren(document.createTextNode(w.slice(0,-1)));const slot=document.createElement('span');slot.className='slot';slot.textContent=solved?w.at(-1):'\u00a0';el('word').append(slot);el('word').setAttribute('aria-label',solved?w:`${w.slice(0,-1).split('').join(', ')}, letzter Buchstabe fehlt`);el('wins').textContent=String(wins).padStart(2,'0');el('hits').textContent=String(hits).padStart(2,'0');el('advance').classList.toggle('on',solved)}
function targets(){const w=words[targetIndex];actors=scene.positions.map(([x,y],i)=>({index:i,x,y,kind:scene.species[i],angle:[.61,-.59,.36][i],size:style==='C'?1.12:1.14,letter:w.options[i],damage:0,dead:0,last:0}));actors.push({index:3,x:scene.pest[0],y:scene.pest[1],kind:style==='C'?'lace':'weevil',angle:1.07,size:.61,letter:null,damage:0,dead:0,last:0});el('aims').replaceChildren();buttons=actors.map(actor=>{const btn=document.createElement('button');btn.type='button';btn.className='enemy';btn.style.left=actor.x/4.8+'%';btn.style.top=actor.y/4.8+'%';if(actor.letter){const tag=document.createElement('span');tag.className='letter';tag.textContent=actor.letter;btn.append(tag);btn.setAttribute('aria-label',`Auf ${actor.letter} schießen`)}else{btn.style.width='9%';btn.style.height='10%';btn.setAttribute('aria-label','Auf den gepanzerten Störkäfer schießen')}btn.addEventListener('click',()=>fire(actor.x,actor.y,actor));el('aims').append(btn);return btn});updateWord()}
function fire(x,y,actor){const now=performance.now(),[px,py]=scene.player,dx=x-px-3,dy=y-py+10;aimAngle=Math.atan2(dx,-dy);const distance=Math.hypot(dx,dy)||1;shotCount++;shot={time:now,x,y,from:[px+3+dx/distance*25,py-10+dy/distance*25]};if(!actor||actor.dead||actor.letter&&solved){burst(x,y,false);return}const w=words[targetIndex],correct=actor.letter===w.word.at(-1);actor.damage=Math.min(3,actor.damage+1);actor.last=now;const destroyed=correct||actor.damage>=3;burst(x,y,destroyed);hits++;if(destroyed){actor.damage=3;actor.dead=now;buttons[actor.index].disabled=true}if(correct){solved=true;wins++;buttons[actor.index].classList.add('hit');el('tip').textContent=w.hint;message(`${w.word} · richtig!`,1500)}else if(actor.letter){el('tip').textContent=w.hint;message(`„${actor.letter}“ passt hier nicht.`,1000)}else{message(destroyed?'Panzer zerlegt':actor.damage===1?'Panzerriss':'Panzer bricht',900)}updateWord()}
function chooseWord(){targetIndex=(targetIndex+1)%words.length;solved=false;shot=null;particles=[];el('feedback').textContent='';el('tip').textContent='Schieß auf den fehlenden Buchstaben.';targets();el('announce').textContent='Nächstes Wort.';listen()}
function listen(){if(currentAudio){currentAudio.pause();currentAudio.currentTime=0}const word=words[targetIndex].word;currentAudio=new Audio(audioWords[word]);currentAudio.play().catch(()=>{el('announce').textContent='Die Aufnahme lässt sich auf diesem Gerät gerade nicht abspielen.'})}
function switchTo(v,write=true){style=Object.hasOwn(scenes,v)?v:'A';scene={...scenes[style],player:[...scenes[style].player]};document.body.dataset.v=style;el('mode').textContent=scene.mode;el('title').textContent=scene.name;const key=document.createElement('b');key.className='key';key.textContent=style;el('selected').replaceChildren(key,document.createTextNode(scene.name));document.title=`Kieselalarm · ${scene.name}`;canvas.width=canvas.height=style==='A'?288:740;g=canvas.getContext('2d');g.lineJoin='round';g.lineCap='round';buildBackdrop();targetIndex=wins=hits=0;solved=false;shot=null;particles=[];splashes=[];aimAngle=.94;currentAudio?.pause();el('feedback').textContent='';el('tip').textContent='Schieß auf den fehlenden Buchstaben.';targets();if(write&&new URL(location.href).searchParams.get('variant')!==style){const url=new URL(location.href);url.searchParams.set('variant',style);try{history.replaceState(null,'',url)}catch{location.assign(url)}}}
function step(delta){const keys=Object.keys(scenes);switchTo(keys[(keys.indexOf(style)+delta+keys.length)%keys.length])}
el('next').addEventListener('click',()=>step(1));el('prev').addEventListener('click',()=>step(-1));el('listen').addEventListener('click',listen);el('advance').addEventListener('click',chooseWord);window.addEventListener('popstate',()=>switchTo(new URL(location.href).searchParams.get('variant'),false));document.addEventListener('keydown',event=>{if(event.altKey||event.ctrlKey||event.metaKey||event.repeat||event.target.closest('input,textarea,[contenteditable="true"]'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();step(event.key==='ArrowLeft'?-1:1);return}const actor=actors.find(a=>a.letter===event.key.toLowerCase());if(actor&&!solved&&!actor.dead){event.preventDefault();fire(actor.x,actor.y,actor)}});
let pointer=null;function point(e){const b=canvas.getBoundingClientRect();return [(e.clientX-b.left)/b.width*480,(e.clientY-b.top)/b.height*480]}
canvas.addEventListener('pointerdown',e=>{if(!e.isPrimary)return;const [x,y]=point(e);const steering=style==='A'&&Math.abs(y-scene.player[1])<62&&Math.abs(x-scene.player[0])<44;pointer={id:e.pointerId,x,y,steering,dragged:false};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId||!pointer.steering)return;const [x]=point(e);if(Math.abs(x-pointer.x)>5)pointer.dragged=true;if(pointer.dragged)scene.player[0]=Math.max(65,Math.min(400,x))});canvas.addEventListener('pointercancel',()=>{pointer=null});canvas.addEventListener('pointerup',e=>{if(!pointer||pointer.id!==e.pointerId)return;const [x,y]=point(e);if(!pointer.dragged)fire(x,y,null);pointer=null});canvas.style.touchAction='none';switchTo(new URL(location.href).searchParams.get('variant')||'A',false);requestAnimationFrame(paint);
</script></body></html>
