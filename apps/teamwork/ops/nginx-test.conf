# Test copy of the live nginx text of the Compose stack, for the page server of the checks (tests/lib/page-server.mjs)
# and for `npm run serve`. It is the live text (ops/nginx.conf of the public Bildungshaus repository) with the four
# additions of nginx-teamwork.additions.conf applied at the places that file names (spec 7.8).
# One value differs from the live text: the survey host in the Content-Security-Policy of /bildungshaus/ is the invented
# host umfrage.example.test, because the checks of this folder (row C5) allow no other real host.
# For tests only. The operator applies nginx-teamwork.additions.conf to the LIVE text, never to this file.
pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  gzip on;
  gzip_types application/javascript text/css application/json text/markdown;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  map $uri $page_csp {
    default "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'";
    ~^/bildungshaus(?:/|$) "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://umfrage.example.test; base-uri 'none'; frame-ancestors 'none'";
    ~^/teamwork(?:/|$) "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
  }
  map $uri $robots_tag {
    default "";
    ~^/teamwork(?:/|$) "noindex, nofollow";
  }
  server {
    listen 8080;
    server_name _;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy $page_csp always;
    add_header Cache-Control no-store always;
    add_header X-Robots-Tag $robots_tag always;
    # Original homepage routes and files stay unchanged.
    location = / { root /site; try_files /index.html =404; }
    location /homepage-assets/ { alias /site/; }
    location = /health { return 200 'ok'; }
    # Absolute path in the redirect avoids exposing the internal :8080 port.
    location = /bildungshaus { return 308 https://dreambau.com/bildungshaus/; }
    location = /bildungshaus/design-system {
      default_type text/html;
      alias /bildungshaus/design-system.html;
    }
    location = /bildungshaus/design-system/ {
      return 308 https://dreambau.com/bildungshaus/design-system;
    }
    location /bildungshaus/ {
      alias /bildungshaus/;
      index index.html;
      autoindex off;
    }
    location = /teamwork { return 308 https://dreambau.com/teamwork/; }
    location ~ ^/teamwork/(?:.*/)?\. { return 404; }
    location /teamwork/ {
      alias /teamwork/;
      index index.html;
      autoindex off;
      absolute_redirect off;
    }
    location / { return 404; }
  }
}
