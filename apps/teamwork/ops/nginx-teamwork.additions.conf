# 1. inside "map $uri $page_csp { ... }", after the /bildungshaus entry:
    ~^/teamwork(?:/|$) "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";

# 2. in the http block, next to that map:
  map $uri $robots_tag {
    default "";
    ~^/teamwork(?:/|$) "noindex, nofollow";
  }

# 3. in the server block, after the existing add_header lines:
    add_header X-Robots-Tag $robots_tag always;

# 4. in the server block, before "location / { return 404; }":
    location = /teamwork { return 308 https://dreambau.com/teamwork/; }
    location ~ ^/teamwork/(?:.*/)?\. { return 404; }
    location /teamwork/ {
      alias /teamwork/;
      index index.html;
      autoindex off;
      absolute_redirect off;
    }
