# The minimal nginx text of `npm run serve` (slice S0): /blog/ is the mounted directory, with index.html as the index.
# It is mounted read-only at /etc/dreambau-blog/ and started with `nginx -c`. The rules of spec 7.4 (the 308, the real
# 404, the feed type, the dot rule, the security policy) come with slice S4 as ops/nginx-blog.additions.conf.
worker_processes 1;
pid /tmp/nginx.pid;

events {
  worker_connections 64;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;

  server {
    listen 8080;
    server_name _;

    location /blog/ {
      alias /srv/blog/;
      index index.html;
    }
  }
}
