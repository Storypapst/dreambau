# The Blog's additions to the nginx text (spec 7.4, rules AD-4, AD-5, DL-4, ER-2 to ER-4, FD-1). The operator applies them
# to the LIVE nginx text, read on the day (spec 3.5, OS-3), at the two places named here; nothing in this file runs on its
# own. The same lines stand, byte for byte, in nginx-blog-test.conf (check V25). The directory that nginx serves is the
# host's /srv/dreambau/blog/public, mounted read-only into the homepage container at /blog (DL-1, DL-2, OS-6).
#
# Measured in a local container of nginx 1.27.5 and (npm run check:server) of nginx:1.27-alpine; not run on the live
# nginx 1.31.2 (spec Appendix D). If the live text differs, keep the intent of each line and run the verify list of 3.5.

# 1. In the map that sets $page_csp, add one line (next to the ~^/teamwork line):
    ~^/blog(?:/|$) "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";

# 2. In the server block, before the final "location / { return 404; }" (or its live equivalent):
    location = /blog { return 308 https://dreambau.com/blog/; }
    location ~ ^/blog/(?:.*/)?\. { return 404; }
    location = /blog/404.html { internal; alias /blog/404.html; }
    location = /blog/feed.xml {
      alias /blog/feed.xml;
      types { }
      default_type application/atom+xml;
    }
    location /blog/ {
      alias /blog/;
      index index.html;
      autoindex off;
      absolute_redirect off;
      error_page 403 =404 /blog/404.html;
      error_page 404 /blog/404.html;
    }
