html.test *, html.test *::before { transition: none !important; animation: none !important; }

n:center}.lang-close kbd{font:inherit;font-size:11px;border:1px solid rgba(var(--fg),.3);border-radius:4px;padding:0 5px}.lang-close:hover{border-color:rgba(var(--fg),.65);background:rgba(var(--fg),.06)}.lang-close:focus-visible{border-radius:22px}.lang-error{flex:none;margin:6px 12px 0;padding:9px 12px;border-radius:8px;border-inline-start:3px solid rgb(255,190,100);background:rgba(255,190,100,.1);color:rgb(255,224,180);font-size:14px;line-height:1.35}.lang-error[hidden]{display:none}@media(hover:none){.lang-close kbd{display:none}}html[dir=rtl] #snd .lbl,html[dir=rtl] #skip,html[dir=rtl] #play,html[dir=rtl] #cta{letter-spacing:0}#cta{flex-wrap:wrap}#cta .words{white-space:normal;overflow-wrap:break-word}#snd .lbl{max-width:14em}
