<!doctype html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:type" content="website">
<meta property="og:locale" content="de_DE">
<meta property="og:title" content="dreambau.com – Jeht nich… jibs nich…">
<meta property="og:description" content="nich warten, quatschen: info@dreambau.com">
<link rel="icon" href="data:,">
<style>
:root { color-scheme: dark; --bg: #06080d; --fg: 233, 237, 245; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
body { font: 400 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: rgb(var(--fg)); -webkit-tap-highlight-color: transparent; }

#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--bg); }

/* The tagline lives in the canvas; this copy is for screen readers, search engines and the no-WebGL fallback. */
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* #blind: hidden like .sr, but no .sr (the static page enlarges that) */
.blind { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid rgba(var(--fg), .9); outline-offset: 3px; border-radius: 4px; }

/* sound toggle */
#snd[hidden] { display: none; }
#snd {
  position: fixed; z-index: 3;
  top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right));
  min-width: 44px; height: 44px; padding: 0 12px; border-radius: 22px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: rgba(6, 8, 13, .42); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  color: rgba(var(--fg), .78); transition: color .2s, background .2s, opacity .6s;
  opacity: 0; pointer-events: none;
}
html.ready #snd { opacity: 1; pointer-events: auto; }
#snd:hover { color: rgb(var(--fg)); background: rgba(6, 8, 13, .6); }
#snd svg { width: 22px; height: 22px; flex: none; }
#snd .lbl { font-size: 13px; letter-spacing: .03em; max-width: 0; overflow: hidden; white-space: nowrap; transition: max-width .3s; }
#snd[data-state="blocked"] .lbl { max-width: 80px; }
#snd[data-state="blocked"] { animation: nudge 2.4s ease-in-out infinite; }
#snd .w { display: none; } #snd .x { display: none; }
#snd[data-state="on"] .w, #snd[data-state="wait"] .w { display: inline; }
#snd[data-state="off"] .x, #snd[data-state="blocked"] .x { display: inline; }
@keyframes nudge { 0%, 100% { box-shadow: 0 0 0 0 rgba(var(--fg), 0); } 50% { box-shadow: 0 0 0 6px rgba(var(--fg), .14); } }

/* skip */
#skip {
  position: fixed; z-index: 3; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom));
  font-size: 12px; letter-spacing: .05em; color: rgba(var(--fg), .5); padding: 10px 6px; min-height: 44px;
  opacity: 0; pointer-events: none; transition: opacity .8s, color .2s;
}
html.ready:not(.done) #skip { opacity: 1; pointer-events: auto; }
#skip:hover { color: rgba(var(--fg), .9); }
#skip kbd { font: inherit; border: 1px solid rgba(var(--fg), .3); border-radius: 4px; padding: 0 5px; margin-inline-end: 6px; }
@media (hover: none) { #skip kbd { display: none; } }

/* the small closing line */
#cta {
  position: fixed; z-index: 2; left: 0; right: 0; margin: 0; text-align: center;
  bottom: max(20px, env(safe-area-inset-bottom)); padding: 0 16px;
  font-size: 13px; letter-spacing: .04em; color: rgba(var(--fg), .66);
  text-shadow: 0 1px 10px rgba(0, 0, 0, .7), 0 0 2px rgba(0, 0, 0, .5);
  opacity: 0; transition: opacity 2.6s ease;
}
#cta.on, #cta:focus-within { opacity: 1; }
#cta a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(var(--fg), .3); padding-bottom: 1px; transition: border-color .2s, color .2s; }
#cta a:hover { color: rgb(var(--fg)); border-color: rgba(var(--fg), .8); }
#cta span { white-space: nowrap; }
html.done #skip { display: none; }

/* headless tests: no transitions, so screenshots show the settled state */
html.test *, html.test *::before { transition: none !important; animation: none !important; }

/* cross-fade used when skipping */
#dip { position: fixed; inset: 0; z-index: 1; background: var(--bg); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
#dip.on { opacity: 1; }

/* replay hint for reduced-motion visitors */
#play { position: fixed; z-index: 3; left: 50%; transform: translateX(-50%); top: max(14px, env(safe-area-inset-top)); font-size: 12px; letter-spacing: .05em; color: rgba(var(--fg), .6); padding: 12px 8px; display: none; }
html.still #play { display: block; }
#play:hover { color: rgb(var(--fg)); }

/* static fallback: no WebGL, no JavaScript, or a broken production */
html.static body, html.static #c { background: radial-gradient(120% 90% at 50% 40%, #121a2b 0%, #06080d 70%); }
html.static #c, html.static #snd, html.static #skip { display: none; }
html.static .sr { position: fixed; inset: 0; width: auto; height: auto; margin: 0; clip: auto; overflow: visible; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; white-space: normal; font-size: clamp(30px, 8vw, 84px); line-height: 1.15; font-weight: 800; letter-spacing: -.01em; padding: 0 20px; }
html.static .sr span { display: block; }
html.static .sr span:first-child, html.static .sr span:nth-child(2) { font-size: .62em; font-weight: 700; opacity: .86; }
html.static #cta { opacity: 1; }

.sw{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.sw[hidden]{display:none}#cta:not(.on) .sw{visibility:hidden}#lang{font:inherit;color:inherit;background:transparent;border:0;border-radius:24px;min-width:44px;min-height:44px;margin-block:-12px;cursor:pointer}.tri{display:inline-block;margin-inline-start:5px;border:4px solid transparent;border-top-color:currentColor;transform:translateY(3px)}
.lang-sheet{position:fixed;z-index:30;top:12vh;left:50%;transform:translateX(-50%);width:min(720px,92%);max-height:min(60vh,440px);display:flex;flex-direction:column;padding:16px;box-sizing:border-box;border:1px solid rgba(var(--fg),.34);border-radius:24px;background:#06080d;color:rgb(var(--fg));box-shadow:0 min(24px,2.5vh) min(80px,5.5vh) #0009}.lang-sheet[hidden]{display:none}.lang-title{min-height:44px;margin:0 0 12px;font:700 20px system-ui}.lang-list{overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(164px,1fr));gap:4px;}.lang-list button,.lang-close{min-height:44px;padding:8px 12px;color:inherit;background:transparent;border:1px solid transparent;border-radius:24px;font:400 15px system-ui;white-space:nowrap;text-align:start;cursor:pointer}.lang-list button[dir=rtl]{font-size:16.5px}.lang-list button[aria-selected=true]{border-color:rgba(var(--fg),.8)}.lang-list button:hover{background:#ffffff12}.lang-close{position:absolute;top:4px;inset-inline-end:16px;border-color:rgba(var(--fg),.34);margin-top:12px;text-align:center}html[dir=rtl] #snd .lbl,html[dir=rtl] #skip,html[dir=rtl] #play,html[dir=rtl] #cta{letter-spacing:0}#cta{flex-wrap:wrap}#cta .words{white-space:normal;overflow-wrap:break-word}#snd .lbl{max-width:14em}
@media(max-width:600px),(pointer:coarse) and (max-height:520px){.lang-sheet{top:auto;bottom:0;width:100%;max-height:70vh;max-height:70dvh;border-radius:24px 24px 0 0;padding-inline:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}.lang-close{position:static;min-height:52px;width:100%;flex-shrink:0}}@media(max-height:520px) and (max-width:600px),(max-height:520px) and (pointer:coarse){.lang-sheet{max-height:86vh;max-height:86dvh}.lang-close{min-height:44px}.lang-sheet{padding-bottom:calc(8px + env(safe-area-inset-bottom))}}

#langback{position:fixed;inset:0;z-index:29;background:transparent}#langback[hidden]{display:none}@media(max-width:600px),(pointer:coarse) and (max-height:520px){#langback{background:#0006}}@media(prefers-reduced-motion:no-preference){.lang-sheet{animation:langshow .26s ease}@keyframes langshow{from{opacity:0}to{opacity:1}}}@media(prefers-reduced-motion:no-preference) and (max-width:600px),(prefers-reduced-motion:no-preference) and (pointer:coarse) and (max-height:520px){.lang-sheet{animation-name:langslide}@keyframes langslide{from{opacity:0;transform:translate(-50%,24px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
<noscript><style>
html body, #c { background: radial-gradient(120% 90% at 50% 40%, #121a2b 0%, #06080d 70%); }
#c, #snd, #skip { display: none; }
.sr { position: fixed; inset: 0; width: auto; height: auto; margin: 0; clip: auto; overflow: visible; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; white-space: normal; font-size: clamp(30px, 8vw, 84px); line-height: 1.15; font-weight: 800; padding: 0 20px; }
.sr span { display: block; }
#cta { opacity: 1; }
</style></noscript>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div id="dip"></div>

<!-- data-lines: the three beats drawn in the animation, separated by | -->
<h1 class="sr" id="tag" data-lines="Jeht nich…|jibs nich…|dreambau.com" aria-describedby="blind"><span>Jeht nich…</span> <span>jibs nich…</span> <span>dreambau.com</span></h1>
<p id="blind" class="blind" data-i18n="blind.{anim}"></p>

<button id="snd" type="button" role="switch" aria-checked="true" data-state="wait" aria-label="Ton" data-i18n-attr="aria-label:snd.aria" aria-keyshortcuts="M" title="Ton aus (M)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.5v5h3.6L12.5 19V5L7.6 9.5z" fill="currentColor" stroke="none"/>
    <path class="w" d="M15.8 9.2a4 4 0 0 1 0 5.6"/>
    <path class="w" d="M18.4 6.6a7.7 7.7 0 0 1 0 10.8"/>
    <path class="x" d="M16 9.6l5 4.8M21 9.6l-5 4.8"/>
  </svg>
  <span class="lbl" aria-hidden="true" data-i18n="snd.on_label">Ton an</span>
</button>
<button id="skip" type="button" aria-keyshortcuts="Escape"><kbd aria-hidden="true">Esc</kbd><span data-i18n="skip.label">überspringen</span></button>
<button id="play" type="button" data-i18n="play.label">Animation abspielen</button>

<p id="cta"><a href="mailto:info@dreambau.com" dir="ltr">info@dreambau.com</a> <span class="words" data-i18n="cta.words">(nich warten, quatschen)</span>
  <span class="sw" hidden>
    <span class="dot" aria-hidden="true">·</span>
    <button id="lang" type="button" aria-haspopup="dialog" aria-expanded="false" data-i18n-attr="aria-label:lang.aria" aria-label="DE: Sprache wählen (aktuell: Deutsch)">
      <span class="code">DE</span><i class="tri" aria-hidden="true"></i>
    </button>
  </span>
</p>

<div id="langback" hidden></div>
<section id="langsheet" class="lang-sheet" role="dialog" aria-modal="true" aria-labelledby="langtitle" hidden><h2 id="langtitle" class="lang-title" data-i18n="lang.title">Sprache</h2><p class="lang-error" role="status" hidden></p><div class="lang-list" role="listbox" data-i18n-attr="aria-label:lang.title" aria-label="Sprache"></div><button type="button" class="lang-close" data-i18n="lang.close">Schließen</button></section>
<script src="i18n.js"></script>
<script src="i18n/index.js"></script>
<script src="shell.js"></script>
</body>
</html>
