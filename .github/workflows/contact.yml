name: Contact form

# Own workflow like blog.yml and teamwork.yml: the root workflow never looks at apps/*.
on:
  pull_request:
    paths:
      - 'apps/contact/**'
      - '.github/workflows/contact.yml'

permissions:
  contents: read

concurrency:
  group: contact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Contact form checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/contact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/contact/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit and HTTP checks
        run: npm run check
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: npm run e2e
