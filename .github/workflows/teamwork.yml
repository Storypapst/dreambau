name: Teamwork

# The root workflow (ci.yml) has no path filter and never looks at apps/*, so the Teamwork folder has its own. It runs
# only when the folder or this file changes: on pushes to main and on pull requests. It cannot be run locally; its
# first real run is the draft pull request that introduces it.
on:
  push:
    branches: [main]
    paths:
      - 'apps/teamwork/**'
      - '.github/workflows/teamwork.yml'
  pull_request:
    paths:
      - 'apps/teamwork/**'
      - '.github/workflows/teamwork.yml'

permissions:
  contents: read

# Its own group: with the root's group the two workflows of one branch would cancel each other.
concurrency:
  group: teamwork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Teamwork checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/teamwork
    steps:
      # Actions are pinned to the same immutable commit SHAs as in the root workflow; tags are repointable.
      # persist-credentials is off because no step here needs git write access.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .nvmrc at the repository root is the single source of truth for the Node major. The npm cache is keyed by the
      # lock file of this folder, which is not a workspace of the root package.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/teamwork/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The Chromium that Playwright 1.56.1 wants (revision 1194, Chromium 141); the root job installs its own.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The page server of the checks starts this image (tests/lib/page-server.mjs); pulling it first keeps the
      # download out of the first check's time.
      - name: Pull the nginx image
        run: docker pull nginx:1.27-alpine

      - name: Run the checks
        run: npm run check
