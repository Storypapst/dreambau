name: Landing checks
on:
  pull_request:
    paths: ['apps/landing/**', '.github/workflows/landing-checks.yml', 'apps/AGENTS.md']
  push:
    branches: [main]
    paths: ['apps/landing/**', '.github/workflows/landing-checks.yml', 'apps/AGENTS.md']
permissions:
  contents: read
jobs:
  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check:languages -- --complete --release
      - run: npm run test:languages
      - run: npm run build:apex
      - run: npm run check:nginx
      - run: npm run e2e:lang -- --quick --allow-missing
      - run: npm run sheet:languages -- --all
      - run: npm run verify -- --quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-verification
          path: |
            apps/landing/verification/
            apps/landing/dist/apex-check/
            apps/landing/dist/lang-sheet/
