name: Landing checks
on:
  pull_request:
    paths: ['apps/landing/**', 'apps/website/**', '.github/workflows/landing-checks.yml', 'apps/AGENTS.md']
  push:
    branches: [main]
    paths: ['apps/landing/**', 'apps/website/**', '.github/workflows/landing-checks.yml', 'apps/AGENTS.md']
permissions:
  contents: read
jobs:
  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, official tag verified
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, official tag verified
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # GNU Unifont draws hexadecimal labels for unassigned code points. Keep the
      # strict missing-glyph regression calibrated against Chromium's own tofu.
      - run: sudo apt-get purge -y fonts-unifont && fc-cache -f
      - run: npm run build
      - run: npm run check:languages -- --complete --release
      - run: npm run test:languages
      - run: npm run build:apex
      - run: npm run check:nginx
      - run: npm run e2e:lang -- --quick --allow-missing
      - run: npm run sheet:languages -- --all
      - run: npm run verify -- --quick
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, official tag verified
        if: always()
        with:
          name: landing-verification
          path: |
            apps/landing/verification/
            apps/landing/dist/apex-check/
            apps/landing/dist/lang-sheet/
