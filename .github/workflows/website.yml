name: Website
on:
  pull_request:
    paths: ['apps/website/**', 'apps/landing/**', '.github/workflows/website.yml']
  push:
    branches: [main]
    paths: ['apps/website/**', 'apps/landing/**', '.github/workflows/website.yml']
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - run: npm ci --prefix apps/landing && npm ci --prefix apps/website
      - run: cd apps/website && npx playwright install --with-deps chromium
      - run: npm run build --prefix apps/landing && npm run build:apex --prefix apps/landing
      - run: npm run check --prefix apps/website
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: website-verification
          path: apps/website/test-results/
