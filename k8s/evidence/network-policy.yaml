apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dreambau-evidence
  namespace: wcr
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: dreambau-evidence }
  policyTypes: [Ingress, Egress]
  ingress:
    # Only the ingress controller may reach the gateway.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - { protocol: TCP, port: 3100 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # MinIO is the only other thing the gateway is allowed to talk to. There is
    # deliberately no egress to the public internet: the service holds no
    # GitHub token and never calls out.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: wcr-storage
      ports:
        - { protocol: TCP, port: 9000 }
