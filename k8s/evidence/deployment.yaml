apiVersion: apps/v1
kind: Deployment
metadata:
  name: dreambau-evidence
  namespace: wcr
  labels: { app.kubernetes.io/name: dreambau-evidence }
spec:
  replicas: 1
  # SQLite on a ReadWriteOnce volume tolerates exactly one writer.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: dreambau-evidence }
  template:
    metadata:
      labels: { app.kubernetes.io/name: dreambau-evidence }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: evidence
          image: dreambau-evidence:0.1.0
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 3100 }
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3100" }
            - { name: EVIDENCE_DATABASE_PATH, value: /data/evidence.sqlite }
            - { name: EVIDENCE_PUBLIC_BASE_URL, value: "https://evidence.dreambau.com" }
            - { name: EVIDENCE_IDENTITIES_PATH, value: /run/secrets/evidence/machine-identities.json }
            - { name: EVIDENCE_STORAGE, value: minio }
            # The gateway reaches MinIO on the cluster network only; this
            # address is never handed to a client.
            - { name: EVIDENCE_S3_ENDPOINT, value: "http://wcr-minio.wcr-storage.svc.cluster.local:9000" }
            - { name: EVIDENCE_S3_REGION, value: us-east-1 }
            - { name: EVIDENCE_S3_BUCKET, value: dreambau-pr-evidence }
            - name: EVIDENCE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: evidence-minio, key: access-key-id }
            - name: EVIDENCE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: evidence-minio, key: secret-access-key }
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            # Video normalisation runs ffmpeg in this container, so the ceiling
            # is well above the API-only footprint.
            limits: { cpu: "2", memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { mountPath: /data, name: data }
            - { mountPath: /run/secrets/evidence, name: identities, readOnly: true }
            - { mountPath: /tmp, name: tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: evidence-data }
        - name: identities
          secret: { secretName: evidence-identities, defaultMode: 256 }
        # ffmpeg stages the original and the normalised video here, so this has
        # to hold two copies of the largest permitted upload.
        - name: tmp
          emptyDir: { sizeLimit: 6Gi }
