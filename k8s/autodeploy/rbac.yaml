# Least privilege: read and patch exactly one deployment. No pods, no secrets, no exec.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: testmails-autodeploy
  labels: { app.kubernetes.io/name: testmails-autodeploy }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: testmails-autodeploy
  labels: { app.kubernetes.io/name: testmails-autodeploy }
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [testmails]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: testmails-autodeploy
  labels: { app.kubernetes.io/name: testmails-autodeploy }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: testmails-autodeploy
subjects:
  - kind: ServiceAccount
    name: testmails-autodeploy
